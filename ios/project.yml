# XcodeGen project for the iOS app.  Build:
#
#   brew install xcodegen && cd ios && xcodegen generate && open SentinelWallet.xcodeproj
#
# The crypto, vault and chain layers are the local SwiftPM package in this directory, so the
# app and the test suite compile exactly the same sources — there is no second copy.
name: SentinelWallet
options:
  bundleIdPrefix: com.sentinellabs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  SentinelCore:
    path: .

targets:
  SentinelWallet:
    type: application
    platform: iOS
    sources:
      - path: SentinelWallet
        excludes:
          - "Resources/Info.plist"
          - "Resources/PrivacyInfo.xcprivacy"
      - path: SentinelWallet/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: SentinelCore
        product: SentinelCore
    info:
      path: SentinelWallet/Resources/Info.plist
      properties:
        CFBundleDisplayName: Sentinel
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.finance
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: >-
          Face ID re-opens the reveal screen for a stored phrase. Sentinel never sends the
          phrase anywhere, and the vault password is still required to open the vault.
        UIRequiredDeviceCapabilities:
          - arm64
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sentinellabs.sentinelwallet
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  SentinelWallet:
    build:
      targets:
        SentinelWallet: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - package: SentinelCore/SentinelWalletCoreTests
  SentinelCore-Package:
    build:
      targets:
        SentinelCore: all
